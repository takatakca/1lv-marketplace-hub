name: Dependency Lock Refresh

on:
  push:
    branches:
      - upgrade/dependency-security-audit

permissions:
  contents: write

jobs:
  refresh:
    if: "!contains(github.event.head_commit.message, 'Apply regenerated dependency lockfile')"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: upgrade/dependency-security-audit

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Remove unused direct Nitro dependency
        run: npm uninstall nitro --package-lock-only --ignore-scripts

      - name: Validate regenerated lockfile
        run: npm ci

      - name: Require clean runtime dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Commit regenerated dependency files
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- package.json package-lock.json; then
            echo "Dependency files already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "Apply regenerated dependency lockfile"
          git push origin HEAD:upgrade/dependency-security-audit
