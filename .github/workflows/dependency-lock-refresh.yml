name: Dependency Lock Refresh

on:
  push:
    branches:
      - upgrade/dependency-security-audit

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Remove unused direct Nitro dependency
        run: npm uninstall nitro --package-lock-only --ignore-scripts

      - name: Validate regenerated lockfile
        run: npm ci

      - name: Capture runtime audit
        shell: bash
        run: |
          set +e
          npm audit --omit=dev --audit-level=high > runtime-audit.txt 2>&1
          code=$?
          echo "$code" > runtime-audit-exit-code.txt
          cat runtime-audit.txt
          exit 0

      - name: Upload regenerated dependency files
        uses: actions/upload-artifact@v4
        with:
          name: dependency-lock-refresh
          path: |
            package.json
            package-lock.json
            runtime-audit.txt
            runtime-audit-exit-code.txt
          retention-days: 2
          if-no-files-found: error
