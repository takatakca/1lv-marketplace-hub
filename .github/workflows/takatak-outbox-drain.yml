name: Drain TAKATAK Outbox

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: takatak-outbox-drain
  cancel-in-progress: false

jobs:
  drain:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate configuration
        shell: bash
        env:
          SITE_URL: ${{ vars.PRODUCTION_URL }}
          DRAIN_SECRET: ${{ secrets.TAKATAK_DRAIN_CRON_SECRET }}
        run: |
          set -euo pipefail
          test -n "$SITE_URL" || (echo "Missing PRODUCTION_URL repository variable" && exit 1)
          test -n "$DRAIN_SECRET" || (echo "Missing TAKATAK_DRAIN_CRON_SECRET repository secret" && exit 1)

          node -e '
            const url = new URL(process.argv[1]);
            if (
              url.protocol !== "https:" ||
              url.username ||
              url.password ||
              url.pathname !== "/" ||
              url.search ||
              url.hash
            ) process.exit(1);
          ' "$SITE_URL" || {
            echo "PRODUCTION_URL must be a clean HTTPS origin."
            exit 1
          }

      - name: Drain queued TAKATAK events
        shell: bash
        env:
          SITE_URL: ${{ vars.PRODUCTION_URL }}
          DRAIN_SECRET: ${{ secrets.TAKATAK_DRAIN_CRON_SECRET }}
        run: |
          set -euo pipefail
          SITE_URL="${SITE_URL%/}"

          RESPONSE="$(curl \
            --fail \
            --silent \
            --show-error \
            --retry 3 \
            --retry-delay 10 \
            --max-time 60 \
            --request POST \
            --header "Authorization: Bearer $DRAIN_SECRET" \
            --header "Content-Type: application/json" \
            "$SITE_URL/api/internal/takatak/drain")"

          node -e '
            const payload = JSON.parse(process.argv[1]);
            if (
              payload.ok !== true ||
              !Number.isInteger(payload.processed) ||
              !Number.isInteger(payload.delivered) ||
              !Number.isInteger(payload.failed) ||
              payload.failed !== 0
            ) process.exit(1);
          ' "$RESPONSE"

          echo "TAKATAK outbox drain completed without delivery failures."
