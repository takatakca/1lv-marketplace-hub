name: Drain TAKATAK Outbox

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: takatak-outbox-drain
  cancel-in-progress: false

jobs:
  drain:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate configuration
        shell: bash
        env:
          SITE_URL: ${{ vars.PRODUCTION_URL }}
          DRAIN_SECRET: ${{ secrets.TAKATAK_DRAIN_CRON_SECRET }}
        run: |
          set -euo pipefail
          test -n "$SITE_URL" || (echo "Missing PRODUCTION_URL repository variable" && exit 1)
          test -n "$DRAIN_SECRET" || (echo "Missing TAKATAK_DRAIN_CRON_SECRET repository secret" && exit 1)

      - name: Drain queued TAKATAK events
        shell: bash
        env:
          SITE_URL: ${{ vars.PRODUCTION_URL }}
          DRAIN_SECRET: ${{ secrets.TAKATAK_DRAIN_CRON_SECRET }}
        run: |
          set -euo pipefail
          SITE_URL="${SITE_URL%/}"

          curl             --fail             --silent             --show-error             --retry 3             --retry-delay 10             --max-time 60             --request POST             --header "Authorization: Bearer $DRAIN_SECRET"             --header "Content-Type: application/json"             "$SITE_URL/api/internal/takatak/drain"
