name: Generate Supabase migration name

on:
  pull_request:
    branches:
      - upgrade/canada-commerce-hardening

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Discover Supabase migration command
        run: npx --yes supabase@latest migration --help
      - name: Generate migration filename
        run: |
          npx --yes supabase@latest migration new persistent_promotions
          echo "GENERATED_MIGRATION=$(find supabase/migrations -maxdepth 1 -type f -name '*_persistent_promotions.sql' -printf '%f\n' | sort | tail -n 1)"
